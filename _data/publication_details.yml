irreducibly-su-2-covariant-quantum-channels-of-low-rank:
  journal_url: https://doi.org/10.1142/S0129055X22500210
  arxiv_url: https://arxiv.org/abs/2105.00709
  abstract: >-
    This paper studies quantum channels of rank at most three with SU(2) symmetry.
    It characterizes PPT and entanglement-breaking behavior, investigates
    degradability, derives Holevo and coherent information, and identifies a
    strong nonadditivity phenomenon for coherent information.
